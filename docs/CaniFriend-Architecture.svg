<text x="1190" y="425" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#65736a">Agent context</text>
<text x="1190" y="452" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#65736a">≠ authoritative pet record</text>
<line x1="1160" y1="390" x2="1160" y2="580" stroke="#9eb9a8" stroke-width="3" stroke-dasharray="7 7"/>
<text x="90" y="875" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#65736a">Production proof: CodeBuild ARM64 → ECR → AgentCore Runtime READY → Strands + Bedrock live invocation → CloudWatch observability.</text>
</svg>